

name: Build APK

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - 
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "APT update attempt $attempt"

            if sudo apt-get -o Acquire::Retries=5 update; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "APT update failed after 5 attempts"
              exit 1
            fi

            sleep 20
          done

          sudo apt-get -o Acquire::Retries=5 install -y \
            git zip unzip build-essential ccache \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev


      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.33

      - name: Cache Buildozer and SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatur-code-studio-apk
          path: bin/*.apk
          if-no-files-found: error
